name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node tests
        run: node --test tests/*.test.js
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the device and the release zip
        run: python3 scripts/build-device.py --zip
      - uses: actions/upload-artifact@v7
        with:
          name: RBox-to-Live
          path: dist/*.zip
